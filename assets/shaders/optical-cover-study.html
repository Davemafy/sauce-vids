const vs=`#version 300 es
layout(location=0) in vec2 p;out vec2 uv;

const fs=`#version 300 es
precision highp float;

// Perspective projection of a convex emitting surface. Its sag is zero
// at the source corners and maximum at the optical axis. The same field

vec2 bend(vec2 p){

    // Newton in the radial scale; valid over the complete visible aperture.
    float a=.5*sag*dot(p,p);

    float outer=exp(min(d,0.)/.055);

    float sidePanel=exp(-pow((ray.x-.85)/.095,4.)-pow((ray.y+.04)/.54,8.));
    float leftPanel=exp(-pow((ray.x+.86)/.11,4.)-pow((ray.y-.23)/.44,8.));
    // Environment energy only enters where the display does not occlude
    // the glass. Sample a diffuse blue illumination, not cloud imagery.
    float gap=smoothstep(.963,.972,max(abs(q.x+dg.x),abs(q.y+dg.y)));
    vec3 environment=blackStage==1?vec3(.022,.025,.031):vec3(.055,.20,.66);
    float internal=exp(-pow((d+.012)/.012,2.))*(.35+.65*max(n2.y,0.));
    vec3 throughGlass=environment*(.36+.38*internal);
    vec3 display=mix(transmitted,throughGlass,gap);
    // Finite studio lights illuminate the curved face before the
    // grazing silhouette; a small normal-facing component keeps
    // the reflection visible on dark source without a uniform wash.
    float specEnergy=(topPanel*1.25+sidePanel*1.05+leftPanel*.68)
                     *(fresnel+.12)*outer;
    // Clear center, very low absorption; no broad grey shoulder wash.
    light=display*(1.-fresnel*.11)+vec3(.96,.98,1.)*specEnergy
          +environment*internal*fresnel*.18;
  }
  if(polished==4){
    // Continuous emissive source behind a clear convex cover. No inset,
    // separate backing, colored rim, or environment substitution.
    float cosI=max(dot(n,V),0.);
    float f0=pow((1.515-1.)/(1.515+1.),2.);
    float fresnel=f0+(1.-f0)*pow(1.-cosI,5.);
    // Smooth optical normal for reflection, avoiding the nearest-edge
    // SDF gradient discontinuity at the corner diagonals. Keep the
    // established refraction mapping unchanged for exact cursor alignment.
    vec2 edgeDist=halfSize-abs(phys);
    vec2 roll=sign(q)*exp(-max(edgeDist,0.)/.043);
    vec3 glassNormal=normalize(vec3(slope+roll*2.8,1.));
    vec3 ray=reflect(-V,glassNormal);
    float f=f0+(1.-f0)*pow(1.-max(dot(glassNormal,V),0.),5.);
    // Finite reflected panels: asymmetrical, terminate before the corners.
    // abs() is necessary for defined GLSL pow on negative coordinates.
    float upper=exp(-pow(abs((ray.y-.65)/.115),4.))
                *exp(-pow(abs((q.x+.38)/.48),6.))*smoothstep(.2,.9,q.y);
    float right=exp(-pow(abs((ray.x-.78)/.13),4.))
                *exp(-pow(abs((q.y-.28)/.51),6.))*smoothstep(.3,.9,q.x);
    float fill=exp(-pow(abs((ray.y-.50)/.28),2.))
               *exp(-pow(abs((q.x+.42)/.64),2.))*smoothstep(.4,.95,q.y);
    float spec=(upper*3.0+right*1.75+fill*.17)*(f+.06);
    // The source is continuous all the way to the silhouette; clear
    // transmission preserves the dark interface instead of adding a rim.
    light=transmitted*(1.-fresnel*.12)+vec3(.98,.99,1.)*spec;
  }
  vec3 result=mix(bg,light,a);
  // Spectral meniscus and broad optical bloom cross the silhouette,
  // without placing a second solid housing around the display.
  if(polished==0)result+=vec3(.25,.16,.8)*exp(-abs(d)/.010)*.085+rim*.90;
  frag=vec4(result,1.);
}`;
function compile(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const post=`#version 300 es
precision highp float;
in vec2 uv;out vec4 frag;
uniform sampler2D hdr;
void main(){
  vec3 c=texture(hdr,uv).rgb;
  vec3 glow=vec3(0.);
  for(int i=0;i<12;i++){
    float ang=float(i)*.5235988;
    vec2 v=vec2(cos(ang)/1920.,sin(ang)/1080.);
    vec3 near=texture(hdr,uv+v*4.).rgb;
    vec3 far=texture(hdr,uv+v*13.).rgb;
    glow+=max(near-vec3(.7),0.)*.029+max(far-vec3(1.),0.)*.015;
  }
  frag=vec4(pow(clamp(c+glow,0.,1.),vec3(1./2.2)),1.);

const postProg=gl.createProgram();gl.attachShader(postProg,compile(gl.VERTEX_SHADER,vs));gl.attachShader(postProg,compile(gl.FRAGMENT_SHADER,post));gl.linkProgram(postProg);if(!gl.getProgramParameter(postProg,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(postProg));

function tex(img,i,name){gl.activeTexture(gl.TEXTURE0+i);let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.generateMipmap(gl.TEXTURE_2D);gl.uniform1i(gl.getUniformLocation(prog,name),i);}
async function img(s){let i=new Image();i.src=s;await i.decode();return i}
// At high sag preserve the previous maximum aperture height. The
// center advances while the corners recede, without cropping the stage.
function apertureHeight(sag,polished){

window.study=async (source,sky,black,bulge=0,polished=false)=>{gl.useProgram(prog);const s=await img(source);tex(s,0,'displayTex');tex(await img(sky),1,'skyTex');let h=apertureHeight(bulge,polished);gl.uniform1f(gl.getUniformLocation(prog,'sag'),bulge);gl.uniform1i(gl.getUniformLocation(prog,'polished'),Number(polished));gl.uniform2f(gl.getUniformLocation(prog,'halfSize'),h*s.width/s.height,h);gl.uniform1i(gl.getUniformLocation(prog,'blackStage'),black?1:0);gl.viewport(0,0,1920,1080);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.useProgram(postProg);gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,hdr);gl.uniform1i(gl.getUniformLocation(postProg,"hdr"),2);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();if(gl.getError()!==gl.NO_ERROR)throw Error('GL draw failed');return document.querySelector('canvas').toDataURL('image/png')};
// Numerically invert the SAME green-channel texture map as the shader.
