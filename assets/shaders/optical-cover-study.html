<!doctype html><meta charset="utf-8"><style>body{margin:0;background:black}canvas{display:block}</style>
<canvas width="1920" height="1080"></canvas><script>
const gl=document.querySelector('canvas').getContext('webgl2',{alpha:false,preserveDrawingBuffer:true});
const vs=`#version 300 es
layout(location=0) in vec2 p;out vec2 uv;
void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const fs=`#version 300 es
precision highp float;
in vec2 uv;out vec4 frag;
uniform sampler2D displayTex,skyTex;
uniform vec2 halfSize;
uniform int blackStage;
vec3 lin(vec3 a){return pow(max(a,0.),vec3(2.2));}
vec3 enc(vec3 a){return pow(clamp(a,0.,1.),vec3(1./2.2));}
float box(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec2 bend(vec2 p){
  vec2 q=p;
  for(int i=0;i<8;i++) q=p/(1.+vec2(.092,.073)*(1.-q.yx*q.yx));
  return q;
}
vec3 panel(vec2 p){
  vec2 t=clamp(p*.5+.5,vec2(.001),vec2(.999));
  return lin(texture(displayTex,vec2(t.x,1.-t.y)).rgb);
}
void main(){
  vec2 aspect=vec2(1920./1080.,1.);
  vec2 world=(uv-.5)*2.*aspect;
  vec2 q=bend(world/halfSize);
  vec2 phys=q*halfSize;
  float d=box(phys,halfSize,.112);
  float a=1.-smoothstep(-.001,.001,d);
  vec3 bg=blackStage==1?vec3(.001):lin(texture(skyTex,vec2(uv.x,1.-uv.y)).rgb);
  bg*=1.-.30*exp(-pow(max(d,0.)/.055,2.));
  // A convex dielectric face with a rolled shoulder. Height and normal
  // derive from one continuous surface, not a painted rectangular border.
  vec2 g=vec2(box(phys+vec2(.001,0),halfSize,.112)-box(phys-vec2(.001,0),halfSize,.112),
              box(phys+vec2(0,.001),halfSize,.112)-box(phys-vec2(0,.001),halfSize,.112));
  vec2 n2=normalize(g+vec2(.0000001));
  float shoulder=exp(min(d,0.)/.045);
  // z(q) is a convex glass sag plus rolled shoulder. Its slope
  // defines the normal used by the dielectric ray calculation.
  vec3 n=normalize(vec3(.21*q+n2*shoulder*3.1,1.));
  vec3 V=vec3(0,0,1);
  float F=.04+.96*pow(1.-max(dot(n,V),0.),5.);
  // Snell refraction through a thin clear cover at three refractive indices.
  vec3 rr=refract(-V,n,1./1.505),rg=refract(-V,n,1./1.515),rb=refract(-V,n,1./1.532);
  vec2 dr=rr.xy/max(-rr.z,.1)*.022/halfSize;
  vec2 dg=rg.xy/max(-rg.z,.1)*.022/halfSize;
  vec2 db=rb.xy/max(-rb.z,.1)*.022/halfSize;
  vec3 center=panel(q+dg);
  vec3 transmitted=vec3(panel(q+dr).r,center.g,panel(q+db).b);
  // A neutral emissive display, with exposure lift restricted to dark
  // source and no replacement typography or artwork.
  vec3 base=pow(max(transmitted,0.),vec3(.84))*(1.-F*.55);
  vec3 reflected=reflect(-V,n);
  float top=pow(max(dot(reflected,normalize(vec3(-.28,.68,.72))),0.),24.);
  float fill=pow(max(dot(reflected,normalize(vec3(.45,-.56,.69))),0.),10.);
  float blue=exp(min(d,0.)/.11)*(.35+.65*(1.-smoothstep(-.8,.1,q.y)));
  // Simulated guided light / subsurface scattering from the glass shoulder.
  vec3 scatter=vec3(.40,.22,1.)*blue*.26;
  float dispersion=1.0+.35*abs(n2.x);
  vec3 rim=vec3(exp(-pow((d+.0042*dispersion)/.0021,2.)),exp(-pow((d+.0000)/.0020,2.)),exp(-pow((d-.0042*dispersion)/.0021,2.)));
  float edge=exp(-pow((d+.0022)/.0021,2.));
  vec3 spec=vec3(.83,.89,1.)*(top*.055+fill*.022)*(.18+.82*shoulder);
  // Selective emission spill from neighboring native source pixels.
  vec3 halo=vec3(0.);
  for(int i=0;i<8;i++){float ang=float(i)*.785398;vec2 v=vec2(cos(ang),sin(ang))*.006;
    vec3 c=panel(q+v);halo+=c*smoothstep(.3,.85,dot(c,vec3(.2126,.7152,.0722)));}
  halo*=.008;
  vec3 light=base+scatter+spec+halo+rim*1.5+edge*1.8;
  vec3 result=mix(bg,light,a);
  // Spectral meniscus and broad optical bloom cross the silhouette,
  // without placing a second solid housing around the display.
  result+=vec3(.25,.16,.8)*exp(-abs(d)/.010)*.085+rim*.90;
  frag=vec4(result,1.);
}`;
function compile(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const post=`#version 300 es
precision highp float;
in vec2 uv;out vec4 frag;
uniform sampler2D hdr;
void main(){
  vec3 c=texture(hdr,uv).rgb;
  vec3 glow=vec3(0.);
  for(int i=0;i<12;i++){
    float ang=float(i)*.5235988;
    vec2 v=vec2(cos(ang)/1920.,sin(ang)/1080.);
    vec3 near=texture(hdr,uv+v*4.).rgb;
    vec3 far=texture(hdr,uv+v*13.).rgb;
    glow+=max(near-vec3(.7),0.)*.029+max(far-vec3(1.),0.)*.015;
  }
  frag=vec4(pow(clamp(c+glow,0.,1.),vec3(1./2.2)),1.);
}`;
const prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const postProg=gl.createProgram();gl.attachShader(postProg,compile(gl.VERTEX_SHADER,vs));gl.attachShader(postProg,compile(gl.FRAGMENT_SHADER,post));gl.linkProgram(postProg);if(!gl.getProgramParameter(postProg,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(postProg));
if(!gl.getExtension('EXT_color_buffer_float'))throw Error('HDR float target unavailable');
gl.activeTexture(gl.TEXTURE2);
const hdr=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,hdr);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,1920,1080,0,gl.RGBA,gl.HALF_FLOAT,null);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,hdr,0);
if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('HDR target incomplete');
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
function tex(img,i,name){gl.activeTexture(gl.TEXTURE0+i);let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.generateMipmap(gl.TEXTURE_2D);gl.uniform1i(gl.getUniformLocation(prog,name),i);}
async function img(s){let i=new Image();i.src=s;await i.decode();return i}
window.study=async (source,sky,black)=>{gl.useProgram(prog);const s=await img(source);tex(s,0,'displayTex');tex(await img(sky),1,'skyTex');let h=.86;gl.uniform2f(gl.getUniformLocation(prog,'halfSize'),h*s.width/s.height,h);gl.uniform1i(gl.getUniformLocation(prog,'blackStage'),black?1:0);gl.viewport(0,0,1920,1080);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.useProgram(postProg);gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,hdr);gl.uniform1i(gl.getUniformLocation(postProg,"hdr"),2);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.finish();if(gl.getError()!==gl.NO_ERROR)throw Error('GL draw failed');return document.querySelector('canvas').toDataURL('image/png')};
window.renderer=gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL);
</script>
