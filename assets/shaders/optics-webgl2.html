<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="optics" width="1920" height="1080"></canvas>
<script>
"use strict";
(()=>{
const canvas=document.getElementById("optics");
const gl=canvas.getContext("webgl2",{alpha:false,antialias:false,preserveDrawingBuffer:true,
  depth:false,stencil:false,premultipliedAlpha:false,powerPreference:"high-performance"});
if(!gl){window.shaderError="WebGL2 unavailable";return;}
const vertex=`#version 300 es
precision highp float;
layout(location=0) in vec2 pos;
out vec2 uv;
void main(){uv=pos*.5+.5;gl_Position=vec4(pos,0.,1.);}`;
const fragment=`#version 300 es
precision highp float;
in vec2 uv;
uniform sampler2D img;
uniform float seed;
out vec4 fragColor;
float hash12(vec2 p) {
  vec3 p3=fract(vec3(p.xyx)*.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
void main(){
  // WebGL's UV origin is bottom-left; texture uploaded from HTML image
  // is flipped at upload so the postprocess does not mirror the film.
  vec2 centered=uv-.5;
  float edge=smoothstep(.56,.77,length(centered));
  float split=.00085*pow(edge,2.3); // < 1.7px in the extreme 1080p corners
  vec2 shift=normalize(centered+vec2(1e-7))*split;
  vec2 sampleUv=vec2(uv.x,1.-uv.y);
  vec3 clr=vec3(texture(img,sampleUv+shift).r,
                texture(img,sampleUv).g,
                texture(img,sampleUv-shift).b);
  float mono=hash12(floor(gl_FragCoord.xy)+seed*17.0)-.5;
  clr+=mono*.020; // 2% monochrome film grain amplitude
  float vignette=1.-.080*pow(clamp(length(centered)/.707,0.,1.),2.0);
  clr*=vignette;
  fragColor=vec4(clamp(clr,0.,1.),1.);
}`;
function compile(type,source){
  const sh=gl.createShader(type);
  gl.shaderSource(sh,source);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));
  return sh;
}
try{
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const texture=gl.createTexture();
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.uniform1i(gl.getUniformLocation(program,"img"),0);
const noise=gl.getUniformLocation(program,"seed");
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
gl.viewport(0,0,1920,1080);
window.opticsRenderer="WebGL2";
window.sauceOptics=async function(encoded,frameIndex){
  const blob=await(await fetch("data:image/png;base64,"+encoded)).blob();
  const bitmap=await createImageBitmap(blob);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bitmap);
  bitmap.close();
  gl.uniform1f(noise,frameIndex);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.finish();
  const error=gl.getError();
  if(error!==gl.NO_ERROR)throw Error("WebGL error "+error);
  return canvas.toDataURL("image/png").split(",")[1];
};
}catch(error){window.shaderError=String(error);}
})();
</script>
