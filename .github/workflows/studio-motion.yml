name: StudioMotion TypeScript + Python
on:
  push:
    branches: [main]
    paths:
      - 'scripts/studio-motion/**'
      - 'scripts/studio_motion_*.py'
      - 'scripts/cinematic_stage.py'
      - 'scripts/session_capture.py'
      - 'scripts/session_replay.py'
      - 'scripts/produce_cinematic_demo.py'
      - 'scripts/verify_studio_motion_export.py'
      - 'scripts/foley_mixer.py'
      - 'scripts/spatial_parallax.py'
      - 'scripts/requirements-render.txt'
      - 'tests/phase2/**'
      - '__init__.py'
      - 'tests/test_studio_motion_runtime.py'
      - 'tests/fixtures/studio-motion-trace.json'
      - '.github/workflows/studio-motion.yml'
  workflow_dispatch:
jobs:
  strict-typecheck-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/studio-motion/package-lock.json
      - name: Install deterministic TypeScript dependencies
        working-directory: scripts/studio-motion
        run: npm ci --ignore-scripts --no-audit
      - name: Compile with strict typing and run plan tests
        working-directory: scripts/studio-motion
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phase 2 scientific and browser dependencies
        run: |
          python -m pip install -r scripts/requirements-render.txt "pytest>=8,<10"
          python -m playwright install --with-deps chromium
      - name: Python planner contract tests
        run: python -m unittest tests.test_studio_motion_runtime -v
      - name: Phase 2 capture privacy, projection and Foley pytest
        run: SAUCE_BROWSER_TEST=1 python -m pytest tests/phase2/test_sauce_motion_phase2.py -q
      - name: Compile silent export verifier
        run: python -m py_compile scripts/verify_studio_motion_export.py
