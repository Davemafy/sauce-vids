name: Sauce web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/session_capture.py'
      - 'scripts/session_replay.py'
      - 'scripts/studio_motion_callouts.py'
      - 'scripts/click_anchor.py'
      - 'tests/phase3/**'
      - 'tests/fixtures/studio-workspace-workflow.json'
      - '.github/workflows/sauce-web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/session_capture.py'
      - 'scripts/session_replay.py'
      - 'scripts/studio_motion_callouts.py'
      - 'scripts/click_anchor.py'
      - 'tests/phase3/**'
      - 'tests/fixtures/studio-workspace-workflow.json'
      - '.github/workflows/sauce-web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-web-captures
          path: |
            apps/web/artifacts/
            apps/web/test-results/
          retention-days: 7

  studio-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual-runtime test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5' 'Pillow>=10,<14' 'playwright>=1.55,<2' 'pytest>=8,<10'
      - name: Test cursor fidelity, scrollbar behavior and kinetic callouts
        run: python -m pytest tests/phase3/test_sauce_studio_phase3.py -q
      - name: Compile touched renderer modules
        run: python -m py_compile scripts/session_capture.py scripts/session_replay.py scripts/studio_motion_callouts.py scripts/click_anchor.py
