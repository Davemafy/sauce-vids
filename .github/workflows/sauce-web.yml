name: Sauce web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sauce-web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/sauce-web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
