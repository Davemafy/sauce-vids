name: sauce-vids
version: 0.4.0
description: Record real product interactions and render authentic SaaS demos with licensed assets.
provides_tools:
  - sauce_capture
  - sauce_render
  - sauce_inspect
  - sauce_scout
  - sauce_plan
  - sauce_review
  - sauce_auto
  - sauce_compose
  - sauce_preview
  - sauce_render_project
requires_env:
  - SAUCE_ALLOWED_HOSTS
python_dependencies:
  - "playwright>=1.55,<2"
  - "Pillow>=11,<13"
