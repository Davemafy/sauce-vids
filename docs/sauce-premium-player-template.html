<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10121b">
<meta name="description" content="{{FILM_DESCRIPTION}}">
<title>{{FILM_TITLE}} — Sauce</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10121b;color:#f1f1f4;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse 82% 52% at 45% 15%,#1c2131 0%,transparent 70%),linear-gradient(165deg,#10121b,#171a26 75%,#10131b)}
a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #e0e3ff;outline-offset:5px}
main{width:min(1360px,100%);margin:auto;padding:18px clamp(16px,3.8vw,56px) 64px}
nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1d;padding:0 0 15px}
.brand{font:italic 700 31px/1 Georgia,serif;letter-spacing:-.08em}
nav span{color:#9ca2b4;font-size:12px}
header{margin:20px 0 17px}
h1{font:400 clamp(32px,4vw,50px)/1.12 Georgia,serif;letter-spacing:-.045em;margin:0 0 9px}
.summary{max-width:740px;font-size:14px;line-height:1.6;color:#a8aebd;margin:0}
.film-shell{position:relative;isolation:isolate;width:min(100%,calc((100dvh - 285px)*16/9));margin-inline:auto}
.film-shell::before{content:"";z-index:-1;position:absolute;inset:2% 3%;
 background:radial-gradient(ellipse at 23% 54%,rgba(91,107,203,.38),transparent 57%),
 radial-gradient(ellipse at 82% 44%,rgba(145,87,156,.30),transparent 61%);
 filter:blur(120px);pointer-events:none}
.stage{padding:7px;background:#171c28;border:1px solid #ffffff18;border-radius:19px;
 box-shadow:0 0 0 1px rgba(255,255,255,.08),
 0 25px 50px -12px rgba(0,0,0,.5),
 0 50px 100px -20px rgba(0,0,0,.3)}
video{display:block;aspect-ratio:16/9;width:100%;height:auto;object-fit:contain;background:#151822;border-radius:13px}
.meta{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;margin-top:15px}
.meta p{margin:0;font-size:13px;line-height:1.5;color:#a9afba}
.download{border:1px solid #ffffff3a;border-radius:8px;padding:11px 15px;background:#ffffff10;
 font-size:13px;font-weight:600;transition:background .18s}
.download:hover{background:#ffffff20}
footer{margin-top:58px;border-top:1px solid #ffffff18;padding-top:18px;color:#8e95a7;font-size:12px}
@media(max-width:700px){
 main{padding:16px 14px 36px}
 .brand{font-size:28px}
 header{margin:30px 0 20px}
 h1{font-size:38px}
 .summary{font-size:13px}
 .film-shell{width:100%}
 .stage{padding:4px;border-radius:13px}
 video{border-radius:9px}
 .meta{align-items:flex-start}
 footer{margin-top:34px}
}
@media(prefers-reduced-motion:reduce){.download{transition:none}}
</style>
</head>
<body><main>
<nav><div class="brand">sauce.</div><span>Product film</span></nav>
<header>
<h1>{{FILM_TITLE}}</h1>
<p class="summary">{{FILM_DESCRIPTION}}</p>
</header>
<div class="film-shell">
<section class="stage">
<video id="film" controls playsinline preload="metadata" poster="{{POSTER_NAME}}" aria-label="{{FILM_TITLE}}">
<source src="{{PREVIEW_NAME}}" type="video/mp4">
Your browser does not support HTML5 video.
</video>
</section>
</div>
<div class="meta">
<p>{{DURATION}} · 16:9 landscape · 60fps master</p>
<a class="download" href="{{MASTER_NAME}}">Watch 1080p / 60fps</a>
</div>
<footer>Recorded from a real software interface. Motion, camera framing and cursor are composed in the final video.</footer>
</main></body></html>
